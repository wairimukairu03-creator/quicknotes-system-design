<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes - Capitalizing Kenya's Tech Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <main class="container">
        <header>
            <h1>Quicknotes System Design</h1>
            <p>Scaling local ideas from Nairobi to Mombasa.</p>
        </header>

        <section class="actions">
            <button id="load-btn">Fetch Tech Notes</button>
            <p id="status" class="idle">Ready to connect...</p>
        </section>

        <section class="form-section">
            <h2>Add a New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note Title:</label>
                    <input type="text" id="title-input" placeholder="e.g., Kilimani Hub Meetup" required>
                </div>

                <div class="form-group">
                    <label for="body-input">Note Content:</label>
                    <textarea id="body-input" placeholder="e.g., Discussing server scaling for upcoming elections..." required></textarea>
                </div>

                <button type="submit" id="submit-btn">Save Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Saved Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>

</body>
</html>
